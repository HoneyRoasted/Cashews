plugins {
    id 'java'
    id 'maven-publish'
}

sourceCompatibility = 1.21
targetCompatibility = 1.21

group 'honeyroasted.cashews'
version '0.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    implementation("com.github.HoneyRoasted:Collect:0.0.10",
            "com.github.HoneyRoasted:Almonds:55e71a3c3d",
            "com.github.HoneyRoasted:Jype:bbe01e5f7a",
            "org.glavo:classfile:0.5.0")

    testImplementation("org.junit.jupiter:junit-jupiter:5.9.2")
}

task ghpagesJavadocs(type: Javadoc) {
    destinationDir = file("/docs")

    source = sourceSets.main.allJava
    classpath = configurations.runtimeClasspath
}

task javadocJar(type: Jar) {
    from javadoc
    archiveClassifier = "javadoc"
}

task sourceJar(type: Jar) {
    from sourceSets.main.allSource
    archiveClassifier = "source"
}

artifacts {
    archives javadocJar, sourceJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = rootProject.name

            from components.java

            artifact sourceJar
            artifact javadocJar
        }
    }
}

test {
    useJUnitPlatform()
}